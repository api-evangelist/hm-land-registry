summary: >-
  HM Land Registry runs three quite different API estates and the cross-cutting
  conventions differ per estate. The Business Gateway REST estate is the mature
  one: an explicit Idempotency-Key request header on the write path, a data /
  errors JSON envelope, URI-path versioning, mutual TLS plus HTTP Basic, and an
  at-least-once poll-based notification feed with explicit acknowledgement. The
  Use land and property data estate is a simple API-key REST service with a
  result / success / error envelope. The open linked-data estate is anonymous and
  follows W3C Linked Data API conventions with extension-based content
  negotiation and _page / _pageSize paging.
authentication:
  business_gateway:
    style: http-basic-over-mutual-tls
    detail: >-
      An HMLR-issued client digital certificate must be installed in the client
      key store and HMLR certificates trusted as root, establishing mutual TLS;
      HTTP Basic credentials for an active Business Gateway user account are then
      sent on every request. Probed 2026-07-26: businessgateway.landregistry.gov.uk
      does not complete a TLS handshake without the client certificate.
    docs: https://landregistry.github.io/bgtechdoc/rest/get_started/developer_guide/index.html
  use_land_and_property_data:
    style: api-key
    header: Authorization
    detail: >-
      The API key issued automatically on self-serve account creation is sent as
      the Authorization header on every request. Accept: application/json is
      advised. Dataset download additionally requires the caller to have signed
      that dataset's licence.
    docs: https://use-land-property-data.service.gov.uk/api-documentation
  open_linked_data:
    style: none
    detail: >-
      The landregistry.data.gov.uk SPARQL endpoint and Linked Data API are
      anonymous. No key, no account, no licence signature.
  artifact: authentication/hm-land-registry-authentication.yml
idempotency:
  supported: true
  scope: business-gateway-submit-an-application
  header: Idempotency-Key
  required: true
  location: header
  spec_evidence:
  - openapi/hm-land-registry-submit-application-to-change-the-register-v1.0-openapi.json#submit_an_application_to_change_the_register_v1
  - openapi/hm-land-registry-submit-application-to-change-the-register-v0.3-openapi.json
  docs: https://landregistry.github.io/bg-dev-pack-redesign/apis/submit-an-application/1.0/technical-guide
  rules:
  - >-
    A new idempotency key must be set for every unique request. A key is only
    reused when retrying a failed request with the same request data.
  - >-
    Changing the request data to fix a validation error makes it a new request and
    requires a new idempotency key.
  - >-
    If the earlier request was processed successfully but the response timed out,
    the retry is treated as a duplicate: the request payload is ignored and the
    original application_request_id is returned.
  retryable_responses:
  - 408
  - 429
  - 5xx (500-599)
  - network timeouts
  non_retryable_responses:
  - 401 (credentials incorrect)
  - 403 (permissions incorrect)
  lineage: >-
    Idempotency-Key is the REST successor to the SOAP MessageID field; the SOAP
    migration table in the technical guide maps MessageID directly to
    Idempotency-Key. The older SOAP estate uses a client-generated message_id for
    the same correlation purpose, retrieved later through the Poll Request
    Service.
  retention: not published
pagination:
  business_gateway_notifications:
    style: time-window plus limit
    parameters:
    - created_after
    - created_before
    - occurred_after
    - occurred_before
    - limit
    max_page_size: 100
    ordering: oldest first (by age)
    detail: >-
      A GET with no parameters returns the 100 oldest notifications. To advance,
      use created_after or occurred_after. There is no cursor or page token; the
      acknowledgement step is what drains the feed.
  open_linked_data:
    style: W3C Linked Data API paging
    parameters:
    - _page
    - _pageSize
    docs: http://landregistry.data.gov.uk/app/ppd/
  use_land_and_property_data:
    style: none
    detail: List endpoints return complete result arrays; history is a full list.
filtering:
  business_gateway_notifications:
    parameters:
    - status
    - notification_type
    - subject
    - additional_provider_filter
    detail: >-
      status defaults to NEW. subject currently only supports "application". Only
      notifications for applications submitted by the caller's business unit and
      matching the requested additional_provider_filter are returned; if no
      additional_provider_filter is given, only applications submitted with no
      additional_provider_filter are returned.
content_negotiation:
  business_gateway: application/json
  use_land_and_property_data: "application/json (send Accept: application/json)"
  open_linked_data:
    style: file-extension suffix
    formats:
    - .json
    - .csv
    - .ttl
    - .rdf
    sparql_results:
    - application/sparql-results+json
    - application/sparql-results+xml
    - text/plain
    - table
envelope:
  business_gateway:
    success_field: data
    error_field: errors
    detail: >-
      Successful bodies wrap the result in a top-level "data" object or array;
      error bodies carry a top-level "errors" array. Not RFC 9457
      application/problem+json.
  use_land_and_property_data:
    success_field: result
    status_field: success
    error_field: error
    detail: >-
      Every body carries a boolean "success"; the payload is in "result" on
      success and a human-readable string in "error" on failure. Verified live
      2026-07-26.
  artifact: errors/hm-land-registry-problem-types.yml
versioning:
  style: uri-path
  detail: >-
    Business Gateway REST paths carry the major version in the path (/v0, /v1,
    /v2). Contracts are also versioned as whole documents in the developer pack
    (Submit an application v0.3 and v1.0; Official Copy Document Availability v1
    and v2). The Use land and property data service is on /api/v1. There is no
    version request header and no date-pinned version train.
  artifact: lifecycle/hm-land-registry-lifecycle.yml
request_tracing:
  business_gateway_rest:
    correlation_id: application_request_id
    detail: >-
      The POST /v1/applications response returns an application_request_id, which
      is then the key used to fetch application information, attach documents and
      messages, and which appears as "subject" on every notification for that
      application.
  business_gateway_soap:
    correlation_id: message_id
    detail: >-
      A client-supplied message_id must be unique per request and is used with the
      Poll Request Service to retrieve a result that could not be returned
      immediately (out of hours, or where manual processing is required).
  no_published_request_id_response_header: true
delivery_semantics:
  notifications:
    guarantee: at-least-once
    duplicate_detection: >-
      Duplicates share the same event_datetime and notification_type but have
      different notification_ids. Each duplicate must be acknowledged separately.
    acknowledgement: POST /v1/notifications/acknowledge with a list of notification_ids
    retention: all notifications are deleted after one month, acknowledged or not
    push: false
    detail: This is a poll feed. HMLR does not call back into consumer systems.
  artifact: asyncapi/hm-land-registry-business-gateway-notifications-asyncapi.yml
document_transfer:
  detail: >-
    Documents are not posted inline. POST /v1/documents/url (send_a_document_v1)
    mints an upload URL which the client PUTs the file to, supplying
    X-Amz-Checksum-Sha256 and Content-Length headers; the returned document_id is
    then referenced from the application. Downloads are the mirror image: GET
    /v1/documents/{document_id} (download_a_document_v1) returns a 302 redirect to
    a short-lived URL. The Use land and property data service uses the same
    pattern, minting a pre-signed S3 URL valid for 10 seconds.
rate_limits:
  published: false
  detail: >-
    No published rate limit or quota for any of the three estates. The Business
    Gateway v1.0 contract does declare a 429 response on
    download_a_document_v1, so throttling exists on at least the document
    download path, but no limit values, window or RateLimit headers are
    documented.
error_handling:
  artifact: errors/hm-land-registry-problem-types.yml
  detail: >-
    Schema violations are rejected as HTTP 400. Other validation failures are not
    returned synchronously: they arrive later as an application.validation-failed
    notification, and the detail is then fetched with the Application information
    API.
licensing:
  open_data: Open Government Licence v3.0 with a required Crown copyright attribution statement
  business_gateway: development licence, business e-services account, and HMLR-issued client certificate
  bulk_datasets: per-dataset licence signature; some datasets chargeable
