summary: >-
  HM Land Registry's test story is split and its own documentation contradicts
  itself, which is recorded here as found. The Business Gateway developer guide
  states that Business Gateway provides both a test and a production environment,
  and the customer test host bgtest.landregistry.gov.uk is declared as a server in
  every published REST contract. The newer developer pack testing guide, covering
  the Submit an application family, says instead that HMLR "does not currently
  provide a test environment for integrators using our Business Gateway APIs" and
  supplies published request/response test stubs as example code, adding that a
  sandbox test environment is planned with no confirmed release date. Both
  statements are reproduced below. The test environment, where available, is not
  self-serve: it is unlocked by signing a development licence and receiving a test
  SSL certificate from HMLR. There are no anonymously reachable sandbox
  credentials.
self_serve: false
test_live_separation:
  style: separate host
  environments:
  - name: Customer Test
    host: https://bgtest.landregistry.gov.uk
    base_paths:
    - /bg2test/api
    - /bg2test
    declared_in:
    - openapi/hm-land-registry-estimate-completion-date-openapi.yml
    - openapi/hm-land-registry-official-search-of-whole-with-data-openapi.yml
    - openapi/hm-land-registry-registered-proprietor-names-openapi.json
    - openapi/hm-land-registry-submit-application-to-change-the-register-v1.0-openapi.json
    - openapi/hm-land-registry-submit-application-to-change-the-register-v0.3-openapi.json
    - openapi/hm-land-registry-official-copy-document-availability-v1-customer-test-openapi.json
    - openapi/hm-land-registry-official-copy-document-availability-v2-customer-test-openapi.json
    note: >-
      Two dedicated customer-test OpenAPI contracts are published in the developer
      pack alongside the production ones (OpenAPI-CustTest.json for Official Copy
      Document Availability v1 and v2); both are harvested into openapi/ in this
      repo.
  - name: Production
    host: https://businessgateway.landregistry.gov.uk
    base_paths:
    - /bg2/api
    - /bg2
  probe:
    date: '2026-07-26'
    result: >-
      Neither businessgateway.landregistry.gov.uk nor bgtest.landregistry.gov.uk
      completes a TLS handshake anonymously; both require an HMLR-issued client
      certificate for mutual TLS.
access:
  how_to_get_it:
  - >-
    Sign the development licence, requested by emailing
    channelpartners@landregistry.gov.uk. Where IT development is outsourced, the
    other party signs the licence.
  - >-
    HMLR sends a test SSL certificate to the named technical contact, which gives
    connectivity and access to the test environment.
  - >-
    The integration support team then provides technical and onboarding support
    through the build.
  - >-
    Going live requires contacting HMLR and holding a business e-services account
    in place first.
  docs: https://landregistry.github.io/bg-dev-pack-redesign/how-to-access-business-gateway
  contact: channelpartners@landregistry.gov.uk
