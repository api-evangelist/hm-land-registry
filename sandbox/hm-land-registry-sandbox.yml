time_simulation:
  supported: false
  detail: No test clock, time-travel or event-trigger tooling is published.
fixture_tooling:
  supported: false
  detail: >-
    No CLI, no fixture generator and no event-trigger tool. HMLR ships static
    example request and response bodies in the developer pack instead.
open_data_alternative:
  detail: >-
    The one HMLR surface that needs no sandbox at all is the open linked-data
    estate. The SPARQL 1.1 endpoint at
    https://landregistry.data.gov.uk/landregistry/query and the Price Paid and UK
    House Price Index Linked Data APIs under
    https://landregistry.data.gov.uk/data/ are anonymous and unmetered under the
    Open Government Licence v3.0, and the Qonsole query console at
    http://landregistry.data.gov.uk/qonsole is a live in-browser playground. For
    anyone prototyping against HMLR data rather than against the conveyancing
    transaction rails, that is the effective sandbox.
  console: http://landregistry.data.gov.uk/qonsole
  verified: '2026-07-26'
use_land_and_property_data:
  sandbox: false
  detail: >-
    No test mode and no test key. The service does publish free sample datasets
    (nps_sample, the National Polygon Service Sample, and per-dataset
    public_resources "Example Data" files) which serve as the shape-check before
    signing a chargeable licence.
