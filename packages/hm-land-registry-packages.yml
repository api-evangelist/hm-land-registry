summary: >-
  HM Land Registry publishes no first-party API client library in any language.
  The @hmlr npm scope is real and first-party — the packages are authored from
  landregistry.gov.uk addresses and built from repositories in the LandRegistry
  GitHub organisation — but every one of them is a front-end / design-system
  package, not an API SDK. There is no HMLR client for the Business Gateway REST
  or SOAP services, none for the Use land and property data service, and none for
  the SPARQL or Linked Data endpoints. Integration is either hand-rolled against
  the published contracts or bought in through a third-party case management
  system. Because no official client library exists, this artifact deliberately
  does NOT carry an SDKs pointer in apis.yml.
official_api_clients: none
