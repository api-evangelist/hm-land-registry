summary: >-
  HM Land Registry's model has two disconnected halves, which is the single most
  important thing to know before integrating. The transactional half — the
  Business Gateway application model — is a deep, richly typed graph rooted on an
  Application, and it is unusual in that its inner objects are addressed by
  client-supplied reference keys rather than server ids: the caller names its own
  parties, documents and addresses ("Borrower1", "Deed", "transferee_address") and
  the transactions reference those names. The only server-minted identifiers are
  application_request_id, document_id, notification_id and, after acceptance, the
  hmlr_reference. The open half — Price Paid Data and the House Price Index — is
  not an object model at all but an RDF graph, keyed on transaction URIs and
  addresses, and is joined to the transactional half only conceptually, through the
  property itself. There is no shared property key across the two: the title number
  is the key on the register side, and the National Polygon Service title-number to
  UPRN lookup that would bridge them costs £20,000 a year plus VAT.
