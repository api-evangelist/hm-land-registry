summary: >-
  Of the five hosts in HM Land Registry's estate, two serve a /.well-known/
  document and both serve only security.txt. There is no OpenID Connect discovery,
  no OAuth authorization server metadata, no api-catalog and no ai-plugin
  anywhere — consistent with an estate that uses HTTP Basic over mutual TLS and
  simple API keys rather than OAuth. The two Business Gateway hosts cannot be
  probed at all: they refuse the TLS handshake without an HMLR-issued client
  certificate, so every request returns a transport-level failure rather than an
  HTTP status.
