  developerPortal:
    url: https://landregistry.github.io/bgtechdoc/
    confirmed: true
    status: 200
    note: >-
      The Business Gateway developer pack is a real, live, fully public developer
      portal on GitHub Pages, backed by the public repo LandRegistry/bgtechdoc
      (502 files). A redesign is in progress at
      https://landregistry.github.io/bg-dev-pack-redesign/ (HTTP 200), which
      catalogues 22 services. The GOV.UK entry points are
      https://www.gov.uk/guidance/business-gateway-developer-pack and
      https://www.gov.uk/guidance/hm-land-registry-business-gateway (both 200).
      This is a portal for a partner channel, not a self-serve signup.
