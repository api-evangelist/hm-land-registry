          Both openapi.json and openapi.html in the v1.1 directory are zero-byte
          files in the gh-pages branch. Nothing was saved. A published-but-empty
          next version is itself a governance finding.
    soapContracts:
      count: 37
      format: XSD (W3C XML Schema), request and response pairs per service
      location: https://github.com/LandRegistry/bgtechdoc/tree/gh-pages/documents
      note: >-
        Fourteen of the 22 Business Gateway services are SOAP-only and their
        machine-readable contracts are XSDs, not OpenAPI — Application Enquiry,
        Discharge Activity, eDRS, Land Charges Full Search, Land Charges
        Bankruptcy Search, Local Land Charges Search, Official Copy Title Known,
        Official Search of Whole (with Priority), Official Search of Part, Online
        Owner Verification, Outstanding Requests, Poll Request, Register Extract,
        Search by Property Description and Search of the Index Map. Not harvested
        into openapi/ because they are not OpenAPI documents; the canonical
        location is recorded here.
    jsonSchemas:
      count: 11
      location: json-schema/
      note: >-
        Notification payload schemas for the Submit an Application to Change the
        Land Register API (application completed, accepted priority pending,
        accepted priority protected, cancelled, correspondence despatched,
        validation failed, attachment success/failed, message success/failed,
        error).
  noMachineReadableContract:
    - api: Use Land and Property Data API
      note: >-
        Documented only as HTML narrative. Probed /openapi.json (302),
        /swagger.json (302), /api-docs (200 but a GOV.UK "Unknown Error" page),
        /api/v1/openapi.json (200 but the same error page). No OpenAPI, no
        Swagger, no OData metadata is published for this API.
    - api: Open data linked-data platform
      note: >-
        No OpenAPI. The contract is the SPARQL 1.1 protocol plus the published RDF
        vocabularies at landregistry.data.gov.uk/def/ppi and /def/common and the
        Linked Data API metadata endpoints under /meta/data/. That is a legitimate
        machine-readable contract, just not an OpenAPI one.
  webhooksAndEvents: >-
    No webhooks anywhere. The Submit an Application to Change the Land Register
    API is asynchronous but uses a POLL model, not callbacks — GET /v1/notifications
    to retrieve outcomes and POST /v1/notifications/acknowledge to clear them. The
    SOAP estate has the same shape (Poll Request Service, Outstanding Requests
    Service). No AsyncAPI document, no event stream, no subscription endpoint.
  sdks: >-
    None published by HM Land Registry. No official client libraries in any
    language. The github.com/LandRegistry organisation is large and active but its
    public repos are GOV.UK design system work, prototypes and dev-environment
    tooling — not API SDKs.
  postman: >-
    No official Postman collection or workspace found for any HMLR API.
  mcpAndAgents: >-
    No MCP server, no llms.txt, no agent-facing surface of any kind.
  status:
    page: null
    note: No dedicated developer status page found; service availability is announced through GOV.UK notices.
