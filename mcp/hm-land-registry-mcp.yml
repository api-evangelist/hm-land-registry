official_server_detail: >-
  HM Land Registry publishes no MCP server, and no MCP server appears in the
  official MCP registry under any HMLR-controlled namespace. Two community
  servers exist on npm (uk-land-registry-price-mcp and
  @pipeworx/mcp-landregistry-uk) and both wrap only the open Price Paid Data
  surface, not the Business Gateway. The tool set below is a candidate derived
  from HM Land Registry's own published OpenAPI operations — it is a design, not
  something HMLR ships.
community_servers:
- name: uk-land-registry-price-mcp
  registry: npm
  url: https://www.npmjs.com/package/uk-land-registry-price-mcp
  official: false
  covers: Price Paid Data (sold house prices), by postcode
- name: "@pipeworx/mcp-landregistry-uk"
  registry: npm
  url: https://www.npmjs.com/package/@pipeworx/mcp-landregistry-uk
  repository: https://github.com/pipeworx-io/mcp-landregistry-uk
  official: false
  covers: Price Paid Data (UK)
server:
  name: hm-land-registry
  transport: stdio
  url: null
access_notes: >-
  Any real MCP server over the Business Gateway tools below inherits Business
  Gateway's access model: it must present an HMLR-issued client certificate for
  mutual TLS and HTTP Basic credentials for an active Business Gateway account,
  and the operator must have signed a development licence. The open-data tools are
  the only ones an unauthenticated agent could serve.
