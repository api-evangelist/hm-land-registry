  scope: the four Use land and property data operations
  verified: '2026-07-26'
asynchronous_errors:
  detail: >-
    Only schema violations are rejected synchronously as HTTP 400. Every other
    validation failure on an application to change the register is reported
    asynchronously as an application.validation-failed notification; the detail is
    then retrieved with get_application_information_v1. application.error reports
    that the application was not added to the daylist because of an HMLR system
    error. application.attachment-failed and application.message-failed carry a
    failure_reason string.
  events:
  - application.validation-failed
  - application.error
  - application.attachment-failed
  - application.message-failed
  artifact: asyncapi/hm-land-registry-business-gateway-notifications-asyncapi.yml
retry_guidance:
