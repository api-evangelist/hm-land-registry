format: mixed
format_detail: >-
  HM Land Registry does not use one error format across its estate. The two
  Business Gateway notification operations are the only ones that declare RFC
  9457 application/problem+json, and download_a_document_v1 offers it alongside
  application/json. Everything else on the Business Gateway returns a bespoke
  application/json envelope with a top-level "errors" array. The Use land and
  property data service returns its own {"error": string, "success": false}
  envelope. There is no published error-code registry: HMLR publishes HTTP status
  semantics and, separately, an asynchronous validation-failure notification, but
  no enumerated application error codes.
formats:
- id: rfc9457
  media_type: application/problem+json
  scope: >-
    get_notifications_v1, acknowledge_notifications_v1 (all statuses) and
    download_a_document_v1 (alongside application/json)
  source: openapi/hm-land-registry-submit-application-to-change-the-register-v1.0-openapi.json
- id: business-gateway-errors-envelope
