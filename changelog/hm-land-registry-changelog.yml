summary: >-
  HM Land Registry publishes no dated developer changelog and no release notes feed
  for its APIs. The only dated change record in the estate is the GOV.UK "Updates
  to this page" block that every GOV.UK guidance page carries, which tracks the
  guidance rather than the contracts. Contract change is communicated by version:
  the developer pack's per-API "Version and Status" selector marks the newest
  version "(latest)" and keeps older ones listed. What follows is the version
  ladder that can be established from the published artifacts, plus the dated
  GOV.UK page history — recorded honestly as a thin surface, not padded out.
scheme: per-contract document versions, surfaced through a version selector
