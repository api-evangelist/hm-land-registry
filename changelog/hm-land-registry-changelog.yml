- version: '1.1'
  api: Submit an application to change the Land Register
  date: null
  status: placeholder
  breaking: unknown
  highlights:
  - >-
    A v1.1 directory exists in the developer pack but both openapi.json and
    openapi.html in it are zero-byte. Re-verified 2026-07-26: HTTP 200, zero-byte
    body. The version is being staged but nothing has been published.
- version: '1.0'
  api: Submit an application to change the Land Register
  date: null
  breaking: true
  additions: true
  highlights:
  - Moved from OpenAPI 3.0.1 to OpenAPI 3.1.0.
  - >-
    Operations renamed from prose ids ("Submit an application API") to snake_case
    versioned operationIds (submit_an_application_to_change_the_register_v1) — a
    breaking change for any generated client.
  - Paths moved from /v0 to /v1.
  - >-
    Four operations added: download_a_document_v1, attach_a_document_v1,
    attach_a_message_v1, and the pre-signed download leg. v0.3 had six operations,
    v1.0 has ten.
  - >-
    Notifications gained explicit application/problem+json error bodies and, on
    download_a_document_v1, a 429 Too Many Requests response.
- version: v2
  api: Official Copy Document Availability
  date: null
  breaking: true
  highlights:
  - >-
    Base path moved from /bg2/api/v1 to /bg2/api/v2. Same single operation,
    getOfficialCopiesAvailability. v1 remains published.
  - >-
    Both versions also ship a dedicated customer-test contract
    (OpenAPI-CustTest.json) pointing at bgtest.landregistry.gov.uk.
- version: null
  api: Business Gateway developer pack
  date: '2026'
  breaking: false
  highlights:
  - >-
    The developer pack has been rebuilt. landregistry.github.io/bgtechdoc now
    redirects to landregistry.github.io/bg-dev-pack-redesign, described by HMLR as
    a "temporary home for the dev pack redesign as it is in progress". The new
    pack adds per-API technical guides and per-API test stubs, a version selector,
    a SOAP-to-REST field migration table, and a searchable API finder covering all
    21 services.
- version: null
  api: Notifications
  date: null
  breaking: false
  highlights:
  - >-
    Eleven notification types published with JSON Schemas, at-least-once delivery
    semantics and an explicit acknowledge endpoint. HMLR states more subjects
    beyond "application" will be added as the API develops.
