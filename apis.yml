- aid: hm-land-registry:business-gateway-official-copy-document-availability-api
  name: Business Gateway Official Copy Document Availability Service
  description: >-
    Returns OC1 document availability (title register and title plan) and a
    collection of OC2 document availability (documents referred to in the register)
    for a given title number, so a case management system can tell a conveyancer
    what official copies can actually be ordered before ordering them. Two OpenAPI
    3.0.0 contracts are published and harvested — v1 on /bg2/api/v1 and v2 on
    /bg2/api/v2 — both securing the single GET operation with HTTP Basic.
  humanURL: https://landregistry.github.io/bgtechdoc/services/official_copy_document_availability_v2/
  baseURL: https://businessgateway.landregistry.gov.uk/bg2/api/v2
  tags:
