- aid: hm-land-registry:use-land-and-property-data-api
  name: Use Land and Property Data API
  description: >-
    RESTful JSON API for the Use land and property data service, used to list the
    HM Land Registry bulk datasets available in the service, read dataset metadata
    and resources, and mint a signed S3 download URL valid for 10 seconds for a
    named file or historical file. Datasets reachable through it include UK
    companies that own property in England and Wales (CCOD), Overseas companies
    that own property in England and Wales (OCOD), the National Polygon Service,
    Restrictive Covenants and Registered Leases. Authentication is an API key sent
    in the Authorization header, issued automatically on self-serve account
    creation — but every download endpoint additionally requires that you have
    signed the licence for that specific dataset and, where the dataset is
    chargeable, paid for it. Called anonymously on 2026-07-26 it returns HTTP 403
    with "Access denied: You need to provide your API Key to perform this
    operation".
  humanURL: https://use-land-property-data.service.gov.uk/api-information
  baseURL: https://use-land-property-data.service.gov.uk/api/v1
