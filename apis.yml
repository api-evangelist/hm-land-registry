aid: hm-land-registry
url: https://raw.githubusercontent.com/api-evangelist/hm-land-registry/refs/heads/main/apis.yml
name: HM Land Registry
kind: company
description: >-
  HM Land Registry is the non-ministerial government department that registers the ownership
  of land and property in England and Wales, guaranteeing title to more than 26 million registered
  estates. In a United Kingdom market that has no MLS and no cooperative listing standard
  — residential listings are controlled by the Rightmove and Zoopla duopoly and reach them
  through agency CRM software — HMLR is the counterweight, and it sits at the legal foundation
  of the value chain rather than at the consumer end: it is the authoritative source of who
  owns what, what it sold for, and where its boundaries are, and every conveyancing transaction
  in England and Wales terminates at its register. Its API posture is genuinely and unusually
  good for a registry, but it is split into three tiers that should never be conflated. First,
  a real open layer: the landregistry.data.gov.uk platform serves a live, anonymous, unauthenticated
  SPARQL 1.1 endpoint plus a W3C Linked Data API over Price Paid Data and the UK House Price
  Index, with JSON/CSV/Turtle content negotiation, alongside bulk Price Paid CSVs and INSPIRE
  index polygons — all under the Open Government Licence v3.0 with no signup, no key and no
  fee. Second, a self-serve keyed tier: the Use land and property data service issues an API
  key automatically on account creation and exposes a documented REST API for dataset metadata
  and signed download URLs, but the datasets behind it require a signed licence per dataset
  and some are chargeable — the Registered Leases commercial licence is £5,000 a year plus
  VAT, and the National Polygon Service, which holds the title boundary polygons and the title
  number to UPRN lookup, is £20,000 a year plus VAT. A state registry selling the spatial
  extent of the public record back to the public is the finding, and it is recorded here plainly.
  Third, the Business Gateway: the B2B channel that conveyancers and their case management
  systems use to submit applications to change the register, order official copies and run
  priority searches. Its developer pack is fully public on GitHub Pages with eight downloadable
  OpenAPI 3.0/3.1 contracts and 37 SOAP XSDs, but the production host businessgateway.landregistry.gov.uk
  will not complete a TLS handshake without an HMLR-issued client certificate, and access
  requires signing a development licence and holding a business e-services account. There
  is no RESO Web API certification, no RESO Data Dictionary, no OData $metadata document and
  no Universal Property Identifier anywhere in HMLR's stack — RESO is a North American NAR
  construct with no UK adoption, and HMLR's machine-readable contracts are OpenAPI, XSD and
  W3C linked data instead.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: true
  label: >-
