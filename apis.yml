- aid: hm-land-registry:hm-land-registry-price-paid-linked-data-api
  name: HM Land Registry Price Paid Data Linked Data API
  description: >-
    W3C Linked Data API over the Price Paid Data dataset, exposing every property sale in England and
    Wales sold for value and lodged for registration since 1995. Resources resolve at /data/ppi/ with
    content negotiation by file extension (.json, .csv, .ttl, .rdf) and standard Linked Data API paging
    parameters such as _pageSize and _page. No authentication of any kind is required; verified HTTP 200
    anonymously on 2026-07-26. Bulk yearly and complete CSV files are also published on the price-paid-data.publicdata
    host. Open Government Licence v3.0.
  humanURL: http://landregistry.data.gov.uk/app/ppd/
  baseURL: https://landregistry.data.gov.uk/data/ppi
  tags:
  - Open Data
  - Linked Data
  - Price Paid Data
  - Transaction
  - United Kingdom
