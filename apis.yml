- aid: hm-land-registry:business-gateway-estimate-completion-date-api
  name: Business Gateway Estimate Completion Date API
  description: >-
    Returns HM Land Registry's estimated completion date for a lodged application,
    given its application reference, so a conveyancer's system can set client
    expectations on how long a registration will take. Single GET operation on
    /v1/applications/{application_reference}/estimate-completion-date, OpenAPI
    3.0.0, HTTP Basic, with both the production and bgtest hosts declared.
