apis:
- aid: hm-land-registry:hm-land-registry-open-data-sparql-api
  name: HM Land Registry Open Data SPARQL API
  description: >-
    Live SPARQL 1.1 query endpoint over HM Land Registry's open linked data — Price Paid Data transaction
    records for every property sale in England and Wales lodged for registration, and the UK House Price
    Index. Callable anonymously with no API key, no account and no licence signature; verified returning
    HTTP 200 with application/sparql-results+json on 2026-07-26. Results are available as table, plain
    text, JSON and XML. Published under the Open Government Licence v3.0 with a required Crown copyright
    attribution statement.
  humanURL: http://landregistry.data.gov.uk/qonsole
  baseURL: https://landregistry.data.gov.uk/landregistry/query
