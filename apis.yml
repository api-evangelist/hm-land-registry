- aid: hm-land-registry:land-register-api
  name: Land Register API
  description: >-
    An OpenAPI 3.0.1 contract, version 6.0.0, titled "Land Register API" and
    published in the public Business Gateway developer pack. It describes two GET
    operations — /title/{titleNumber} and /draft-titles/{titleNumber} — and states
    that it "aims to be the primary method of accessing register data for HM Land
    Registry". No baseURL is recorded here because the specification declares no
    public production server: its servers list contains only localhost ports and
    internal HMLR hosts under development, test and *.stp.hmlr.zone. Access is not
    a developer product at all — it must be requested through the Digital Register
    project team, an individual bearer token is minted per consuming service, and
    the consumer must file a Fraud Impact Assessment and must not expose the data
    externally. Recorded as a real published contract for an internal government
    API, not as a callable public API.
  humanURL: https://landregistry.github.io/bgtechdoc/
  tags:
  - Title
  - Property Records
  - Land Registry
  - Internal
