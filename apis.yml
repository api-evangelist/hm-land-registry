- aid: hm-land-registry:business-gateway-official-search-of-whole-with-data-api
  name: Business Gateway Official Search of Whole (with Priority) with Data API
  description: >-
    RESTful expansion of the long-standing Official Search of Whole SOAP service.
    An official search with priority by a purchaser against the whole of a
    registered title or a pending first registration application, protecting the
    agreement between buyer, seller and lender for the priority period. Single
    POST operation on /v1/official-searches-of-whole, described by an OpenAPI
    3.1.0 document that declares both the test host bgtest.landregistry.gov.uk and
    the production host businessgateway.landregistry.gov.uk.
  humanURL: https://landregistry.github.io/bgtechdoc/services/official_search_of_whole_rest/
  baseURL: https://businessgateway.landregistry.gov.uk/bg2/api
