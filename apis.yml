- aid: hm-land-registry:uk-house-price-index-linked-data-api
  name: UK House Price Index Linked Data API
  description: >-
    W3C Linked Data API over the UK House Price Index, the official house price statistic calculated by
    the Office for National Statistics from HM Land Registry, Registers of Scotland and Land and Property
    Services Northern Ireland sales data. Region and month resources resolve at /data/ukhpi/ with .json,
    .csv and .ttl representations carrying average price, index and percentage change broken out by property
    type, buyer type, funding type and new-build status. Anonymous, no key; verified HTTP 200 on 2026-07-26.
    Open Government Licence v3.0.
  humanURL: http://landregistry.data.gov.uk/app/ukhpi/
  baseURL: https://landregistry.data.gov.uk/data/ukhpi
