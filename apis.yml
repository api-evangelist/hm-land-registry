- aid: hm-land-registry:business-gateway-submit-an-application-to-change-the-register-api
  name: Business Gateway Submit an Application to Change the Land Register API
  description: >-
    The Business Gateway REST API through which conveyancers and their case
    management systems lodge applications to change the land register, upload and
    download supporting documents, add attachments and messages to a lodged
    application, and poll and acknowledge asynchronous outcome notifications. Two
    OpenAPI contracts are published and harvested here — v0.3 (OpenAPI 3.0.1, six
    operations on /v0) and v1.0 (OpenAPI 3.1.0, spec version 1.0.5, ten operations
    on /v1). A v1.1 directory exists in the developer pack but both openapi.json
    and openapi.html in it are zero-byte placeholders, so nothing was saved for it.
    Security is HTTP Basic over mutual TLS with an HMLR-issued client certificate.
  humanURL: https://landregistry.github.io/bgtechdoc/rest/get_started/developer_guide/index.html
  baseURL: https://businessgateway.landregistry.gov.uk/bg2/api
